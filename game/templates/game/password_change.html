{% extends 'game/base.html' %}
{% load static %}
{% block title %}修改密码 · karanoli的小屋{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <img class="brand-avatar large" src="{% static 'game/images/karanoli-icon.jpeg' %}" alt="">
    <span class="eyebrow">账户安全</span>
    <h1>修改密码</h1>
    <p class="auth-intro">输入当前密码，再设置一个新的密码。</p>
    <form method="post" class="stack-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="button primary full" type="submit">保存新密码</button>
    </form>
    <p class="form-foot"><a href="{% url 'profile' %}">← 返回个人中心</a></p>
  </div>
</section>
{% endblock %}
